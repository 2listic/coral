name: Publish Coral container

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - '.github/workflows/docker-publish.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'tools/container_smoke/**'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - '.github/workflows/docker-publish.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'tools/container_smoke/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-coral-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/2listic/coral

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: sha-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Reserve space for the deal.II SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=coral-sdk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=coral-sdk-${{ matrix.arch }}
      - name: Load a plugin built against each installed SDK
        run: |
          for config in Debug Release; do
            docker run --rm \
              -v "$PWD/tools/container_smoke:/smoke:ro" \
              --entrypoint bash "$IMAGE:$TAG" -euc '
                prefix="/opt/dealiix/coral/$1"
                cmake -S /smoke -B "/tmp/$1" -GNinja -DCMAKE_BUILD_TYPE="$1" \
                  -Dcoral_DIR="$prefix/lib/cmake/coral"
                cmake --build "/tmp/$1" -j2
                ctest --test-dir "/tmp/$1" --no-tests=error --output-on-failure
              ' bash "$config"
          done
      - uses: docker/login-action@v3
        if: github.repository == '2listic/coral' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.repository == '2listic/coral' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$IMAGE:$TAG"

  publish:
    if: github.repository == '2listic/coral' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags and verify public access
        run: |
          digest_tag="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$digest_tag" --tag "$IMAGE:main" \
            "$digest_tag-amd64" "$digest_tag-arm64"
          docker buildx imagetools inspect "$digest_tag"
          DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$digest_tag" >/dev/null
