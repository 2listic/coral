name: Publish Coral container

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - '.github/workflows/docker-publish.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'backends/dealii/**'
      - 'tools/container_smoke/**'
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitmodules'
      - '.github/workflows/docker-publish.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'backends/dealii/**'
      - 'tools/container_smoke/**'
  workflow_dispatch:
    inputs:
      update_latest:
        description: Refresh latest from the published stable releases
        type: boolean
        default: false
      retire_initial_v1_3_0:
        description: Remove only the superseded v1.3.0 image without the deal.II backend
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-coral-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/2listic/coral

jobs:
  release_source:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag is on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Look for the tested image from this exact revision
        id: release
        run: |
          digest=$(bash scripts/find_tested_container.sh ghcr.io/2listic/coral "$(git rev-parse HEAD)")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build:
    needs: release_source
    if: >-
      ${{ !cancelled() && !inputs.update_latest && !inputs.retire_initial_v1_3_0 && (needs.release_source.result == 'skipped' ||
      (needs.release_source.result == 'success' && needs.release_source.outputs.digest == '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: sha-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Reserve space for the deal.II SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=coral-sdk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=coral-sdk-${{ matrix.arch }}
      - name: Load the installed deal.II backend in each configuration
        run: |
          for config in Debug Release; do
            docker run --rm --entrypoint bash "$IMAGE:$TAG" -euc '
              prefix="/opt/dealiix/coral/$1"
              "$prefix/bin/$1/coral" --plugin "$prefix/lib/$1/libcoral_backend_dealii.so" \
                register --registry-path /tmp/dealii-registry.json
              grep -Fq PoissonSolver /tmp/dealii-registry.json
            ' bash "$config"
          done
      - name: Load a plugin built against each installed SDK
        run: |
          for config in Debug Release; do
            docker run --rm \
              -v "$PWD/tools/container_smoke:/smoke:ro" \
              --entrypoint bash "$IMAGE:$TAG" -euc '
                prefix="/opt/dealiix/coral/$1"
                cmake -S /smoke -B "/tmp/$1" -GNinja -DCMAKE_BUILD_TYPE="$1" \
                  -Dcoral_DIR="$prefix/lib/cmake/coral"
                cmake --build "/tmp/$1" -j2
                ctest --test-dir "/tmp/$1" --no-tests=error --output-on-failure
              ' bash "$config"
          done
      - uses: docker/login-action@v3
        if: github.repository == '2listic/coral' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.repository == '2listic/coral' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker push "$IMAGE:$TAG"

  publish:
    needs: [release_source, build]
    if: >-
      ${{ !cancelled() && github.repository == '2listic/coral' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
      (needs.build.result == 'success' || needs.release_source.outputs.digest != '') }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags and verify public access
        env:
          RELEASE_DIGEST: ${{ needs.release_source.outputs.digest }}
        run: |
          digest_tag="$IMAGE:sha-$GITHUB_SHA"
          tag=main
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag=$GITHUB_REF_NAME; fi
          if [[ -n "$RELEASE_DIGEST" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$RELEASE_DIGEST"
          else
            docker buildx imagetools create --tag "$digest_tag" --tag "$IMAGE:$tag" \
              "$digest_tag-amd64" "$digest_tag-arm64"
          fi
          docker buildx imagetools inspect "$IMAGE:$tag"
          DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$IMAGE:$tag" >/dev/null

  latest:
    needs: publish
    if: >-
      ${{ !cancelled() && github.repository == '2listic/coral' &&
      ((github.ref_type == 'tag' && needs.publish.result == 'success') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.update_latest && !inputs.retire_initial_v1_3_0)) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ghcr-release-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the highest published stable release
        run: bash scripts/publish_latest_container.sh ghcr.io/2listic/coral

  retire_initial_v1_3_0:
    if: >-
      github.repository == '2listic/coral' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.retire_initial_v1_3_0
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the obsolete release index after main has moved
        run: |
          if git ls-remote --exit-code --tags https://github.com/2listic/coral.git refs/tags/v1.3.0; then
            echo 'Remove the obsolete Git tag before retiring the image.' >&2
            exit 1
          else
            [[ "$?" == 2 ]]
          fi
          endpoint=orgs/2listic/packages/container/coral/versions
          digest=sha256:2ae2e519fe5b46a8fa130b3f4732f416cccb13f8295a54e2a64dc5b3dc49dbcc
          version=$(gh api --paginate "$endpoint?per_page=100" |
            jq -cs --arg digest "$digest" '[.[][] | select(.name == $digest)]')
          if [[ "$(jq length <<< "$version")" == 0 ]]; then
            echo 'The obsolete image index is already absent.'
            exit 0
          fi
          id=$(jq -er '
            select(length == 1) | .[0] |
            select(all(.metadata.container.tags[];
              . == "v1.3.0" or . == "latest" or
              . == "sha-c746cbe27547887e9e8e868a9334e6e43f6890ab")) |
            .id | select(type == "number")
          ' <<< "$version")
          gh api --method DELETE "$endpoint/$id"
          echo "Retired $digest."
